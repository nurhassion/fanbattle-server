<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<title>Sports Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Space+Mono:wght@700&display=swap');
  body { margin:0; background:#0B1220; color:#fff; font-family:'Oswald',sans-serif; overflow:hidden; }
  .scorebar { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:14px 20px;
              background:linear-gradient(90deg,#1a2f5c,#000,#5c3a1a); border-bottom:2px solid #E8B33D; }
  .team { font-size:22px; }
  .team.right { text-align:right; }
  .score { font-family:'Space Mono',monospace; font-size:34px; color:#E8B33D; }
  .mid { text-align:center; font-size:14px; color:#8FA3C0; padding:0 16px; }
  .competition { text-align:center; padding:8px; color:#8FA3C0; font-size:14px; }
  .flash { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
           font-size:90px; font-weight:800; opacity:0; pointer-events:none; }
  .flash.show { animation: pop 1.4s ease-out forwards; }
  @keyframes pop {
    0% { opacity:0; transform:scale(0.5) rotate(-8deg); }
    30% { opacity:1; transform:scale(1.1) rotate(2deg); }
    60% { transform:scale(1) rotate(0); }
    100% { opacity:0; }
  }
</style>
</head>
<body>
  <div class="scorebar">
    <div class="team" id="teamA">—</div>
    <div class="mid">
      <div style="font-size:12px;" id="sportEmoji">🏆</div>
      <div class="score" id="scoreA">-</div>
    </div>
    <div class="team right" id="teamB">—</div>
  </div>
  <div class="scorebar" style="grid-template-columns:1fr; padding:6px;">
    <div class="score" id="scoreB" style="text-align:center; font-size:22px;">-</div>
  </div>
  <div class="competition" id="competition">লাইভ ম্যাচ খোঁজা হচ্ছে...</div>

  <div class="flash" id="flash"></div>
  <audio id="narrator" autoplay></audio>

<script>
  const params = new URLSearchParams(location.search);
  const channel = params.get("channel") || "default";

  let lastEventAt = 0;
  const audioEl = document.getElementById("narrator");
  const flashEl = document.getElementById("flash");

  const FLASH_STYLE = {
    wicket: { text: "OUT!", color: "#C23B3B" },
    six: { text: "SIX!", color: "#E8B33D" },
    four: { text: "FOUR!", color: "#3EA6FF" },
    goal: { text: "GOAL!", color: "#2ECC71" },
  };

  function showFlash(type) {
    const cfg = FLASH_STYLE[type];
    if (!cfg) return;
    flashEl.textContent = cfg.text;
    flashEl.style.color = cfg.color;
    flashEl.style.textShadow = "0 0 24px rgba(0,0,0,0.6)";
    flashEl.classList.remove("show");
    void flashEl.offsetWidth; // reflow, animation restart করার জন্য
    flashEl.classList.add("show");
  }

  async function poll() {
    try {
      const res = await fetch(`/gaming/state/sports-${channel}.json?t=` + Date.now());
      const data = await res.json();

      document.getElementById("sportEmoji").textContent = data.sportEmoji || "🏆";
      document.getElementById("teamA").textContent = data.teamA || "—";
      document.getElementById("teamB").textContent = data.teamB || "—";
      document.getElementById("competition").textContent = data.competition || "";

      if (data.sport === "cricket" && data.score?.scores?.length) {
        const inn = data.score.scores[data.score.scores.length - 1];
        document.getElementById("scoreA").textContent = `${inn.runs}/${inn.wickets}`;
        document.getElementById("scoreB").textContent = `(${inn.overs} ov)`;
      } else if (data.sport === "football" && data.score) {
        document.getElementById("scoreA").textContent = `${data.score.homeGoals} - ${data.score.awayGoals}`;
        document.getElementById("scoreB").textContent = data.score.minute ? `${data.score.minute}'` : "";
      }

      if (data.lastEvent && data.lastEvent.at !== lastEventAt) {
        lastEventAt = data.lastEvent.at;
        showFlash(data.lastEvent.type);
        if (data.lastEvent.audioUrl) {
          audioEl.src = data.lastEvent.audioUrl;
          audioEl.play().catch(() => {});
        }
      }
    } catch (e) {
      // state ফাইল এখনো তৈরি হয়নি — চুপচাপ retry
    }
  }
  setInterval(poll, 3000);
  poll();
</script>
</body>
</html>
